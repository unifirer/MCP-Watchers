server:
  transport: "stdio"

llm:
  provider: "openai"
  model: "surplus 4.1"
  structured_output_mode: "json_schema"
  providers:
    openai:
      api_key: "sk-1234"
      api_url: "http://127.0.0.1:4000/v1"

embedder:
  provider: "openai"
  model: "sentence-transformers/all-MiniLM-L6-v2"
  dimensions: 384
  providers:
    openai:
      api_key: "sk-local"
      api_url: "http://127.0.0.1:8003/v1"

database:
  provider: "falkordb"
  providers:
    falkordb:
      uri: "redis://localhost:6379"

graphiti:
  group_id: "main"
  entity_types:
    - name: "Preference"
      description: "User preferences, choices, opinions, or selections"
    - name: "Requirement"
      description: "Specific needs, features, or functionality"
    - name: "Procedure"
      description: "Standard operating procedures and sequential instructions"
    - name: "Location"
      description: "Physical or virtual places where activities occur"
    - name: "Event"
      description: "Time-bound activities, occurrences, or experiences"
    - name: "Organization"
      description: "Companies, institutions, groups, or formal entities"
    - name: "Document"
      description: "Information content in various forms"
    - name: "Topic"
      description: "Subject of conversation, interest, or knowledge domain"
    - name: "Person"
      description: "An individual human referenced in the content"
    - name: "Object"
      description: "Physical items, tools, devices, or possessions"
