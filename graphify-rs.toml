# graphify-rs configuration
# Generated by `graphify-rs init` (graphify-rs 0.8.1), then pinned for this repo.
# These values serve as defaults and can be overridden by CLI flags.

# Output directory for graph files.
#
# PINNED, and this is the whole reason the file exists: graphify-rs 0.8.1's
# built-in default is NOT a repo-local directory - a bare `graphify-rs build`
# writes to the machine-global store C:\Users\<user>\.graphify-rs\<repo>-<hash>\.
# Three things in this repo already agree on `graphify-out/` instead:
#   * .gitignore ignores it,
#   * Modules/watcher_mcp_detect.ps1 (Test-GraphifyRsInitialized) probes for
#     graphify-out/graph.json,
#   * Modules/graphify_ignore_gate.ps1 keeps it out of rebuild triggers.
# Leaving this unset would make the launcher's mandated rebuild
# (`graphify-rs build --path . --update --no-llm`) land outside the repo, so
# detection could never converge. Verified 2026-09-21 in scratch repos.
output = "graphify-out"

# Disable LLM-based semantic extraction.
# PINNED to match AGENTS.md section 3.3.3: rebuilds MUST use --no-llm. The
# launcher's argv already passes --no-llm, so this only hardens a bare
# `graphify-rs build` (e.g. a manual run) against reaching for a model/key.
no_llm = true

# Only process code files (skip docs/papers)
# code_only = false

# Export formats (comma-separated). Available: json,html,graphml,cypher,svg,wiki,obsidian,report
# Leave empty or omit for all formats.
# formats = ["json", "html", "report"]

# LLM provider for semantic extraction
# Deliberately left unset: no_llm above is true, so no provider, model or key is
# required for this repo. Uncomment and fill in only if semantic extraction is
# ever wanted.
# [llm]
# provider = "anthropic"          # anthropic | openai | ollama | openai_compatible
# model = "claude-sonnet-4.6"  # required, no default
# anthropic_api_key = "sk-..."    # optional, falls back to ANTHROPIC_API_KEY env or Claude Code OAuth
# anthropic_base_url = "https://api.anthropic.com"  # optional override
# openai_api_key = "sk-..."       # optional, falls back to OPENAI_API_KEY env
# openai_base_url = "https://api.openai.com/v1"     # optional override
# ollama_base_url = "http://localhost:11434"          # optional override
# openai_compatible_api_key = "..."                   # optional
# openai_compatible_base_url = "http://localhost:8000/v1"  # required for openai_compatible
