[pytest]
# Minimal configuration for the MCP Watchers launcher tests.
# This file is intentionally small. It must NOT inherit the VAD audio suite
# configuration, because that suite imports numpy and Modules.VAD.
#
# Run from the tests directory:
#   python -m pytest -c pytest.ini -q
#
# The -c flag matters. Use the bare filename. The path tests/pytest.ini
# double-resolves to tests/tests/pytest.ini and fails with FileNotFoundError.
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q -ra
norecursedirs = .git __pycache__ .pytest_cache *.tests.ps1
