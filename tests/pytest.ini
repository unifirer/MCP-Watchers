[pytest]
# Minimal configuration for the MCP Watchers launcher tests.
# This file is intentionally small. It must NOT inherit the VAD audio suite
# configuration, because that suite imports numpy and Modules.VAD.
#
# Run from the tests directory with the repo venv:
#   ..\.venv\Scripts\python.exe -m pytest -c pytest.ini -q
#
# The -c flag matters. Use the bare filename. The path tests/pytest.ini
# double-resolves to tests/tests/pytest.ini and fails with FileNotFoundError.
#
# Which python? mcpw-xeu.1: the repo venv at .venv\Scripts\python.exe is the
# pinned interpreter and carries this suite's dependencies at known versions
# (psutil, pywin32, pytest, filelock, pyyaml). Create it with
#   uv venv --python 3.14 .venv
#   uv pip install --python .venv\Scripts\python.exe psutil pywin32 pytest filelock pyyaml
#
# Run .\run_pytest.ps1 to have the interpreter chosen for you: it tries the venv
# first, then falls back to probing machine-wide candidates for `import pytest`
# (mcpw-3nq: `python`, `python3` and `py` all resolve to an interpreter that has
# no pytest), clears PYTHONPATH for the child (mcpw-a1d: WorkBuddy shim
# sitecustomize fails CLOSED on deletes - never run bare pip with it set;
# clear first: $env:PYTHONPATH = $null), and applies the -c rule above.
# It forwards extra arguments.
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q -ra
norecursedirs = .git __pycache__ .pytest_cache *.tests.ps1
